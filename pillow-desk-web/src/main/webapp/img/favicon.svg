<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Pillow -->
    <rect x="8" y="8" width="32" height="28" rx="6"
          fill="none"
          stroke="#2F37FF"
          stroke-width="3"/>

    <!-- Bell -->
    <g transform="translate(6 30)">
        <circle cx="5" cy="2" r="2" fill="#F2B300"/>
        <path d="M0 10
                 C0 4 4 0 10 0
                 C16 0 20 4 20 10
                 Z"
              fill="#F2B300"/>
    </g>

    <!-- Calendar -->
    <g transform="translate(24 22)">
        <rect x="0" y="0" width="24" height="20" rx="3"
              fill="white"
              stroke="#10164E"
              stroke-width="2"/>

        <line x1="0" y1="5" x2="24" y2="5"
              stroke="#10164E"
              stroke-width="2"/>

        <line x1="6" y1="-2" x2="6" y2="5"
              stroke="#10164E"
              stroke-width="3"
              stroke-linecap="round"/>

        <line x1="18" y1="-2" x2="18" y2="5"
              stroke="#10164E"
              stroke-width="3"
              stroke-linecap="round"/>

        <path d="M6 12 L10 16 L18 8"
              fill="none"
              stroke="#25AA82"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"/>
    </g>
</svg>