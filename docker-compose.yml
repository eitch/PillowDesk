services:
  app:
    image: repo.strolch.li/docker/pillow-desk:latest
    container_name: pillow-desk
    hostname: app
    ports:
      - 127.0.0.1:8085:8080
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - TZ=Europe/Zurich
      - STROLCH_ENVIRONMENT=dev
    volumes:
      - ./runtime:/pillow-desk-runtime
      - ./tomcat-logs:/usr/local/tomcat/logs
    restart: unless-stopped
